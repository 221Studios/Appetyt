server {
    listen 80;
    listen [::]:80;
    server_name appetyt.221studio.pl www.appetyt.221studio.pl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/appetyt;
        default_type text/plain;
    }

    location / {
        return 301 https://appetyt.221studio.pl$request_uri;
    }
}
