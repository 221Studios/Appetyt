services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appetyt
      POSTGRES_USER: appetyt
      POSTGRES_PASSWORD: appetyt
    ports:
      - "5432:5432"
    volumes:
      - appetyt-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appetyt -d appetyt"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://appetyt:appetyt@db:5432/appetyt
      CORS_ORIGINS: "*"
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  appetyt-postgres:
