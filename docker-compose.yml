services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appetyt
      POSTGRES_USER: appetyt
      POSTGRES_PASSWORD: appetyt
    ports:
      - "5432:5432"
    volumes:
      - appetyt-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appetyt -d appetyt"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://appetyt:appetyt@db:5432/appetyt
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENVIRONMENT: development
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-http://localhost:3000}
      AUTH_MOBILE_REDIRECT_URI: ${AUTH_MOBILE_REDIRECT_URI:-appetyt://auth/callback}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  appetyt-postgres:
